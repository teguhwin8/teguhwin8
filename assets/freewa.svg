<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2a24" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#25d366"/>
    </marker>
  </defs>
  <rect width="1200" height="750" fill="#0d1210"/>
  <rect width="1200" height="750" fill="url(#grid)"/>

  <text x="80" y="130" fill="#25d366" font-size="22" font-weight="600" letter-spacing="4">OPEN SOURCE</text>
  <text x="80" y="200" fill="#f2f5f3" font-size="64" font-weight="700">FreeWA</text>
  <text x="80" y="250" fill="#9fb0a6" font-size="28">Self-hosted WhatsApp gateway</text>

  <!-- flow -->
  <g font-size="24" font-weight="600">
    <rect x="80" y="360" width="280" height="130" rx="18" fill="#141c18" stroke="#2c3a33" stroke-width="2"/>
    <text x="220" y="418" fill="#f2f5f3" text-anchor="middle">REST API</text>
    <text x="220" y="455" fill="#7d8f85" font-size="19" font-weight="400" text-anchor="middle">NestJS</text>

    <rect x="460" y="360" width="280" height="130" rx="18" fill="#141c18" stroke="#25d366" stroke-width="2"/>
    <text x="600" y="418" fill="#f2f5f3" text-anchor="middle">Message queue</text>
    <text x="600" y="455" fill="#7d8f85" font-size="19" font-weight="400" text-anchor="middle">BullMQ · Redis</text>

    <rect x="840" y="360" width="280" height="130" rx="18" fill="#141c18" stroke="#2c3a33" stroke-width="2"/>
    <text x="980" y="418" fill="#f2f5f3" text-anchor="middle">WhatsApp devices</text>
    <text x="980" y="455" fill="#7d8f85" font-size="19" font-weight="400" text-anchor="middle">Multi-device</text>
  </g>
  <line x1="365" y1="425" x2="452" y2="425" stroke="#25d366" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="745" y1="425" x2="832" y2="425" stroke="#25d366" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- features -->
  <g font-size="22" fill="#c9d4ce">
    <circle cx="92" cy="600" r="6" fill="#25d366"/><text x="112" y="608">Realtime QR login</text>
    <circle cx="402" cy="600" r="6" fill="#25d366"/><text x="422" y="608">Queue dashboard</text>
    <circle cx="702" cy="600" r="6" fill="#25d366"/><text x="722" y="608">One-command Docker setup</text>
  </g>
</svg>
